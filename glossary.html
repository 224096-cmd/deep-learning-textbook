<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用語集 | 動かして学ぶディープラーニング</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header compact sticky">
  <div class="nav-row"><a href="index.html" class="nav-home">← 目次</a><span class="nav-title">用語集</span><span></span></div>
</header>
<main class="container">
  <section class="card">
    <h2>用語集（全 48 語）</h2>
    <p>各章に出てくることばをまとめました。語の右の「第○章」を押すと、その章へ移動します。</p>
    <input type="search" id="q" class="glossary-search" placeholder="ことばで検索（例：勾配、ゲート、softmax）">
    <div class="gl-grid" id="list"></div>
  </section>
</main>
<footer class="site-footer"><p>動かして学ぶディープラーニング ｜ © 2026 三重大学 教育学部 技術・ものづくり教育コース 卒業研究</p></footer>
<script src="assets/js/content.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var TERMS = [{"t": "重み（weight, w）", "d": "各入力をどれだけ重視するかを表す数。学習で変わる。", "ch": 1}, {"t": "バイアス（bias, b）", "d": "しきい値を動かすための「下駄」。これも学習で変わる。", "ch": 1}, {"t": "決定境界", "d": "出力が 0 と 1 で切り替わる線。2 入力なら w1·x1 + w2·x2 + b = 0 の直線。", "ch": 1}, {"t": "エポック", "d": "訓練データを 1 周すること。", "ch": 1}, {"t": "隠れ層", "d": "入力と出力の間にある層。ここで特徴が作られる。", "ch": 2}, {"t": "活性化関数", "d": "直線を曲げる関数。tanh、ReLU、シグモイドなど。これが無いと何層重ねても直線のまま。", "ch": 2}, {"t": "損失（loss）", "d": "予測と正解のズレを 1 つの数にしたもの。小さいほど良い。", "ch": 2}, {"t": "勾配降下法", "d": "損失が減る方向に重みを少しずつ動かす方法。", "ch": 2}, {"t": "誤差逆伝播法", "d": "出力側の誤差を入力側へ逆向きに伝えて、各重みの「責任（勾配）」を計算する方法。", "ch": 2}, {"t": "畳み込み（convolution）", "d": "フィルタと画像の重なった部分を掛けて足す計算を、位置をずらしながら繰り返すこと。", "ch": 3}, {"t": "カーネル／フィルタ", "d": "3×3 などの小さな重みの表。学習で「縦線検出器」「斜め線検出器」などに育つ。", "ch": 3}, {"t": "特徴マップ", "d": "畳み込みの出力画像。フィルタに反応した場所が明るくなる。", "ch": 3}, {"t": "プーリング", "d": "近くの数ピクセルをまとめて 1 つにする（最大値を取る＝MaxPool）。多少のズレを吸収し、計算量を減らす。", "ch": 3}, {"t": "ストライド／パディング", "d": "フィルタを何ピクセルずつ動かすか／端をゼロで埋めるかどうか。", "ch": 3}, {"t": "勾配消失／勾配爆発", "d": "層を通るたびに勾配が掛け算され、0 に近づく／巨大になる現象。", "ch": 4}, {"t": "残差（residual）", "d": "「目標の出力 − 入力」の差分。ResNet の各層はこの差分だけを学ぶ。", "ch": 4}, {"t": "恒等写像", "d": "入力をそのまま出力すること。残差接続があれば、層が何もしなくても恒等写像になるので、深くしても悪くはならない。", "ch": 4}, {"t": "one-hot ベクトル", "d": "語彙数と同じ長さで、その単語の位置だけ 1、他は 0。どの 2 単語も「距離が同じ」。", "ch": 5}, {"t": "埋め込みベクトル", "d": "各単語に対応する、長さ d（例：2〜300）の実数の列。学習で決まる。", "ch": 5}, {"t": "分布仮説", "d": "「似た文脈に現れる単語は似た意味を持つ」という考え方。word2vec の土台。", "ch": 5}, {"t": "skip-gram", "d": "中心の単語から、その周りの単語を当てるように学習する word2vec の方式。", "ch": 5}, {"t": "コサイン類似度", "d": "2 つのベクトルの向きの近さ。1 に近いほど似ている。", "ch": 5}, {"t": "隠れ状態 h_t", "d": "時刻 t までに読んだ情報の要約ベクトル。RNN の「記憶」。", "ch": 6}, {"t": "展開（unroll）", "d": "ループを時間方向に引き延ばし、1 本の深いネットとして描くこと。深さ＝系列の長さ。", "ch": 6}, {"t": "BPTT", "d": "展開したネットに対する誤差逆伝播。長い系列ほど「深い」ので、第4章と同じ勾配消失が起きる。", "ch": 6}, {"t": "エンコーダ／デコーダ", "d": "読む側の RNN／書く側の RNN。", "ch": 9}, {"t": "文脈ベクトル", "d": "エンコーダの最後の隠れ状態。入力文全体の要約。", "ch": 9}, {"t": "自己回帰", "d": "デコーダが「自分が直前に出した単語」を次の入力にして 1 語ずつ生成すること。", "ch": 9}, {"t": "教師強制（teacher forcing）", "d": "学習時は、直前の出力の代わりに正解の単語をデコーダに入れて学習を安定させる方法。", "ch": 9}, {"t": "&lt;BOS&gt; / &lt;EOS&gt;", "d": "文の始まり／終わりを表す特別な記号。デコーダは &lt;EOS&gt; を出したら生成を止める。", "ch": 9}, {"t": "Query（Q）", "d": "「いま何を探しているか」。デコーダ側の状態から作る。", "ch": 10}, {"t": "Key（K）", "d": "「私はこういう情報です」という各入力の見出し。Q と比べられる。", "ch": 10}, {"t": "Value（V）", "d": "実際に取り出す中身。K とペアになっている。", "ch": 10}, {"t": "softmax", "d": "数の列を、全部正で合計 1 の「割合」に変える関数。大きい数ほど大きな割合になる。", "ch": 10}, {"t": "アライメント", "d": "出力の各単語が入力のどの単語に注目したかの対応表（ヒートマップで描ける）。", "ch": 10}, {"t": "自己注意", "d": "Query も Key も Value も同じ文から作る Attention。文中の単語同士の関係を取り出す。", "ch": 11}, {"t": "マルチヘッド", "d": "Attention を h 組並列に行う。ヘッドごとに「主語と動詞」「代名詞と指す先」など別の関係を見る。", "ch": 11}, {"t": "位置エンコーディング", "d": "単語の位置を表すベクトル。sin・cos の波を使うと、どんな長さでも作れる。", "ch": 11}, {"t": "√d でのスケール", "d": "次元が大きいと内積が大きくなりすぎ softmax が尖るので、割って調整する。", "ch": 11}, {"t": "マスク言語モデル（MLM）", "d": "単語の 15% ほどを隠し、元の単語を当てる学習課題。", "ch": 12}, {"t": "双方向", "d": "穴の左側の文脈と右側の文脈を同時に使うこと。GPT は左側だけ（第13章）。", "ch": 12}, {"t": "事前学習 → ファインチューニング", "d": "まず大量の文で一般的な言葉の知識を学び、次に少量のラベル付きデータで目的の仕事に合わせる。", "ch": 12}, {"t": "[CLS]", "d": "文の先頭に付ける特別な記号。その位置の出力を「文全体の要約」として分類に使う。", "ch": 12}, {"t": "自己回帰言語モデル", "d": "P(次の単語 | これまでの単語) を学ぶモデル。左から右へ一方向。", "ch": 13}, {"t": "因果マスク", "d": "学習時に「未来の単語」を見られないように注意の表の右上を隠す（第11章の✓）。", "ch": 13}, {"t": "温度（temperature）", "d": "次の単語の確率分布の尖り具合。低い＝無難で繰り返しがち、高い＝多様だが支離滅裂。", "ch": 13}, {"t": "貪欲法 / サンプリング / top-k", "d": "常に 1 位を選ぶ／確率に従ってくじ引き／上位 k 個からくじ引き。", "ch": 13}, {"t": "文字 n-gram", "d": "ここで使う小さなモデル。直前 (n−1) 文字から次の 1 文字の確率を数える。GPT の「文脈 → 次」の構造を最小限で再現。", "ch": 13}];
  var list = document.getElementById("list"), q = document.getElementById("q");
  function render(filter) {
    list.innerHTML = "";
    TERMS.filter(function (x) { return !filter || (x.t + x.d).toLowerCase().indexOf(filter.toLowerCase()) >= 0; }).forEach(function (x) {
      var ch = DL.CHAPTERS[x.ch - 1];
      var item = DL.el("div", { class: "gl-item" }, [
        DL.el("div", {}, [DL.el("b", { text: x.t }), DL.el("a", { class: "gl-ch", href: "chapters/" + ch.file, text: "第" + x.ch + "章 " + ch.title })]),
        DL.el("p", { text: x.d })
      ]);
      list.appendChild(item);
    });
    if (!list.children.length) list.appendChild(DL.el("p", { class: "muted", text: "見つかりませんでした。" }));
  }
  q.addEventListener("input", function () { render(q.value.trim()); });
  render("");
})();
</script>
</body>
</html>
